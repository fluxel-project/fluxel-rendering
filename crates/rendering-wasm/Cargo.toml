[package]
name = "fluxel-rendering-wasm"
version.workspace = true
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false
description = "Narrow wasm-bindgen bindings for Fluxel's retained browser scene"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The browser bridge owns the AssetStore the renderer's residency keys on, so it
# takes the same pinned asset revision the renderer's `gpu-residency` does.
fluxel-assets = { git = "https://github.com/fluxel-project/fluxel-bases.git", rev = "22c4eb0e199575aa71b59f3abc6ec3f72d934b9a", version = "=0.13.4" }
# The renderer's GPU-upload path and this crate's browser bridge are still
# disabled until their integration is migrated to the frozen v13 RHI surface.
# Backend lowering itself is complete; this is now an ecosystem integration
# task rather than a reason to retain the retired implementation tree.
#
# The reason this crate's manifest is the lever: a crate that compiles to nothing
# on the host target (`#![cfg(target_arch = "wasm32")]` in src/lib.rs) still
# participates in workspace feature unification, so leaving these features on
# would keep `cargo check --workspace` red on Windows for the entire rewrite.
# fluxel-renderer = { path = "../renderer", features = ["gpu-upload", "gpu-residency", "webgl2-residency"] }
fluxel-renderer = { path = "../renderer" }
# fluxel-rhi = { path = "../rhi", default-features = false, features = ["webgl2", "webgpu"] }
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = ["HtmlCanvasElement"] }
