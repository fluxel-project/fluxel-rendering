[package]
name = "fluxel-rhi"
version.workspace = true
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Fluxel's portable RHI: capability-layered GPU execution for native and browser backends"
repository = "https://github.com/fluxel-project/fluxel-rendering"

# Feature names are carried over from the pre-rewrite manifest because sibling
# crates and examples select a backend through them, and a name that disappears
# breaks their manifests rather than their code. Each backend's lowering lands
# under `src/backend/<name>`; until it does, a feature selects nothing and the
# API tree deliberately compiles with none of them enabled. A feature is not a
# support claim: `08-governance-freeze-checklist.md` section 60 requires the
# capability matrix and the evidence before a backend may be described as
# supported.
[features]
default = ["dx12", "vulkan"]
dx12 = ["dep:windows"]
vulkan = ["dep:ash"]
android-wsi-evidence = ["vulkan"]
gl-family = []
native-gl-wgl = ["gl-family", "dep:glow", "dep:glutin_wgl_sys", "dep:raw-window-handle"]
native-gles-egl = ["gl-family", "dep:glow", "dep:khronos-egl", "dep:raw-window-handle"]
webgl2 = ["gl-family", "dep:glow", "dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
webgpu = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
metal = [
    "dep:block2",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
    "dep:raw-window-handle",
    "dep:raw-window-metal",
]
test-support = []
# Source-only, host-injected usage templates under `examples/`.  These targets
# deliberately do not construct a native provider: applications obtain that
# provider from their platform integration and pass it into the workload.
examples = []

[dependencies]
glow = { version = "=0.18.0", optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }

# Hardware fixtures and examples are the only RHI consumers allowed to depend
# on the native host.  The library itself remains host-free; a fixture retains
# the host window while its backend-private presentation target borrows it.
[dev-dependencies]
fluxel-host = { path = "../../../fluxel-host" }
raw-window-handle = "=0.6.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Vulkan is loaded dynamically so enabling the backend does not create a link-
# time dependency on a platform loader. Native handles remain confined to
# `src/backend/vulkan`.
ash = { version = "=0.38.0", optional = true, default-features = false, features = ["loaded", "std"] }
khronos-egl = { version = "=6.0.0", features = ["dynamic"], optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
# Keep the Objective-C/Metal stack aligned with the wgpu-hal 30.0.1 API usage
# audited during the Metal port. Mixing objc2 framework-crate generations is not supported: their
# Retained/ProtocolObject types form one ABI-level ownership vocabulary.
block2 = { version = "=0.6.2", optional = true }
objc2 = { version = "=0.6.3", optional = true }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = [
    "std",
    "NSError",
    "NSRange",
    "NSString",
] }
objc2-metal = { version = "=0.3.2", optional = true, default-features = false, features = [
    "std",
    "block2",
    "MTLBlitCommandEncoder",
    "MTLAllocation",
    "MTLArgument",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDepthStencil",
    "MTLDevice",
    "MTLDrawable",
    "MTLEvent",
    "MTLLibrary",
    "MTLPipeline",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLSampler",
    "MTLTexture",
    "MTLTypes",
    "MTLVertexDescriptor",
] }
objc2-quartz-core = { version = "=0.3.2", optional = true, default-features = false, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
    "objc2-metal",
] }
raw-window-metal = { version = "=1.0.0", optional = true }

[target.'cfg(windows)'.dependencies]
# The owned Direct3D 12 backend's binding, and nothing else uses it: no module
# outside `src/backend/dx12` may name a `windows` type, which is what keeps
# `ID3D12Device`, `DXGI_ADAPTER_DESC1`, and every `HRESULT` on the private side
# of the seam (`01:126-132`: "Backend-private objects must not be returned from
# the portable API").
#
# Pinned exactly rather than ranged. A `windows` minor release adds and renames
# COM declarations, so a range would let a resolver change which `Dxgi` and
# `Direct3D12` items exist underneath a frozen spec revision; the same reasoning
# that pins it in the pre-rewrite manifest applies here.
windows = { version = "=0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # `D3D_FEATURE_LEVEL`, which `D3D12CreateDevice` takes. It lives in the
    # Direct3D module even though the call is a Direct3D 12 one.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    # `CreateEventW`, `WaitForSingleObject`, and `CloseHandle`, which are the
    # three calls `wait_idle` makes. Direct3D 12 states completion only through a
    # fence, and the documented way to block on one is `SetEventOnCompletion`
    # followed by a wait on the event it signals — polling `GetCompletedValue` in
    # a loop instead would burn a core for the whole wait, which is a cost
    # `wait_idle` should not impose on a shutdown path.
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    # `CreateEventW` itself is gated on this rather than on `System_Threading`,
    # because its first parameter is a `*const SECURITY_ATTRIBUTES`. The
    # declaration is in `System::Threading` and the type is in `Security`, and
    # the binding puts the `cfg` on the function, so a build with only the
    # former links nothing at all.
    "Win32_Security",
] }
glutin_wgl_sys = { version = "=0.6.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "=0.3.105", optional = true }
wasm-bindgen = { version = "=0.2.128", optional = true }
web-sys = { version = "=0.3.105", optional = true, features = [
    "Document",
    "HtmlCanvasElement",
    "Performance",
    "WebGl2RenderingContext",
    "WebGlActiveInfo",
    "WebGlBuffer",
    "WebGlContextAttributes",
    "WebGlContextEvent",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlQuery",
    "WebGlRenderbuffer",
    "WebGlSampler",
    "WebGlShader",
    "WebGlSync",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Gpu",
    "Window",
    "console",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.50"
wasm-bindgen-futures = "0.4.55"

