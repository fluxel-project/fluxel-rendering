[package]
name = "rendering-integration"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
publish = false

[workspace]
resolver = "2"

[features]
default = []
dx12 = ["fluxel-renderer/dx12", "fluxel-rhi/dx12", "dep:fluxel-host"]
native-gl-wgl = ["fluxel-renderer/native-gl-wgl", "fluxel-rhi/native-gl-wgl", "dep:fluxel-host", "dep:glow"]

[dependencies]
external-renderer = { path = "../external-renderer" }
fluxel-renderer = { path = "../../crates/renderer" }
fluxel-shader = { path = "../../crates/shader" }
fluxel-material = { path = "../../crates/material" }
fluxel-assets = { git = "https://github.com/fluxel-project/fluxel-bases.git", rev = "124e825f82e5cd0eb485c95fe1281b11c8dbc844", version = "=0.13.4" }
fluxel-rhi = { git = "https://github.com/fluxel-project/fluxel-rhi", rev = "b5d569feace548a6ed498901deaf31a5efcaca61", version = "=0.1.0", default-features = false }
fluxel-host = { git = "https://github.com/fluxel-project/fluxel-host", rev = "8d101624c603a6c1e0badf729768c6b26e70fba8", version = "=0.1.0", optional = true }
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
glow = { version = "=0.18.0", optional = true }
