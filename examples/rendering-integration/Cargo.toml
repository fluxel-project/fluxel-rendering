[package]
name = "rendering-integration"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
publish = false

[workspace]
resolver = "2"

[features]
default = []
dx12 = ["fluxel-renderer/dx12", "fluxel-rhi/dx12", "dep:fluxel-host"]
native-gl-wgl = ["fluxel-renderer/native-gl-wgl", "fluxel-rhi/native-gl-wgl", "dep:fluxel-host", "dep:glow"]

[dependencies]
fluxel-renderer = { path = "../../crates/renderer" }
fluxel-shader = { path = "../../crates/shader" }
fluxel-material = { path = "../../crates/material" }
fluxel-assets = { git = "https://github.com/fluxel-project/fluxel-bases.git", rev = "ee640d57a8d7c32d251252d0e8b32950636a770c", version = "=0.13.4" }
fluxel-rhi = { git = "https://github.com/fluxel-project/fluxel-rhi", rev = "0f7f785d4f0ccc62e125dd6cf560d91333ec85cf", version = "=0.1.0", default-features = false }
fluxel-host = { git = "https://github.com/fluxel-project/fluxel-host", rev = "33a6bbb3fa15500e928b4192ca8f280b735034d9", version = "=0.1.0", optional = true }
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
glow = { version = "=0.18.0", optional = true }
