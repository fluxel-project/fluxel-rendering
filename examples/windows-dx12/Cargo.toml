[package]
name = "fluxel-windows-presentation-harness"
version = "0.8.3"
edition = "2024"
publish = false

[workspace]

# This deliberately remains an independent manifest until the temporary proof
# harness has a settled renderer-facing API.  It must not become a workspace
# platform crate.

[dependencies]
fluxel-renderer = { path = "../../crates/renderer", features = ["gpu-upload"] }
fluxel-rhi = { git = "https://github.com/fluxel-project/fluxel-rhi", rev = "97a003fb11e30bd97ec62efe82e031f7bcf26ab5", features = ["dx12", "vulkan", "test-support"] }
fluxel-host = { path = "../../../fluxel-host" }
