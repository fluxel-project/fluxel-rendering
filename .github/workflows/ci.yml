name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.87.0']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Workspace formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Workspace lint
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace behavior
        run: cargo test --workspace --lib --tests --locked
      - name: Documentation contracts
        run: cargo test --workspace --doc --locked
      - name: Independent consumer and private-API compile failures
        run: cargo test --manifest-path examples/external-renderer/Cargo.toml --locked
      - name: Independent consumer lint
        if: matrix.toolchain == 'stable'
        run: cargo clippy --manifest-path examples/external-renderer/Cargo.toml --all-targets --locked -- -D warnings
      - name: DX12 integration CPU contracts
        run: cargo test --manifest-path examples/rendering-integration/Cargo.toml --features dx12 --locked
      - name: WGL integration CPU contracts
        run: cargo test --manifest-path examples/rendering-integration/Cargo.toml --features native-gl-wgl --locked

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integration tooling behavior
        run: python -m unittest discover -s tools/integration -p "test_*.py"
      - name: Benchmark tooling behavior
        run: python -m unittest discover -s tools/bench -p "test_*.py"
