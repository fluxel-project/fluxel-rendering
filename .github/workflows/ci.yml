name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gl-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest scripts/tests/test_check_gl_architecture.py
      - run: python scripts/check_gl_architecture.py

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test -p fluxel-rhi --no-default-features --locked
      - run: cargo test -p fluxel-rhi --no-default-features --features test-support --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo test --workspace --doc --all-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked

  wasm-check:
    name: WASM check (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.87.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown
      - run: cargo check -p fluxel-rendering-wasm --target wasm32-unknown-unknown --locked

  wasm-quality:
    name: WASM lint and release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo clippy -p fluxel-rendering-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo build -p fluxel-rendering-wasm --target wasm32-unknown-unknown --release --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: wasm-bindgen --version
      - run: wasm-bindgen --target web --out-dir target/wasm-bindgen-smoke target/wasm32-unknown-unknown/release/fluxel_rendering_wasm.wasm
      - run: python3 -c "from pathlib import Path; stage = Path('target/wasm-bindgen-smoke'); assert any(stage.glob('*.js')); assert any(stage.glob('*_bg.wasm'))"

  wasm-webgpu-contract:
    name: WebGPU production recovery and resource contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: browser-actions/setup-chrome@v1
        id: chrome-with-driver
        with:
          install-chromedriver: true
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Bind the matching Chrome binary to WebDriver
        run: >-
          python3 -c "import json, pathlib;
          source=pathlib.Path('scripts/webgpu_webdriver.json');
          output=pathlib.Path('target/webgpu-webdriver.json');
          data=json.loads(source.read_text());
          data['goog:chromeOptions']['binary']='${{ steps.chrome-with-driver.outputs.chrome-path }}';
          output.parent.mkdir(parents=True, exist_ok=True);
          output.write_text(json.dumps(data))"
      - name: Run production recovery and resource tests in Chrome
        run: >-
          cargo test -p fluxel-rhi
          --target wasm32-unknown-unknown
          --no-default-features
          --features webgpu
          --lib
          --locked
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          CHROMEDRIVER: ${{ steps.chrome-with-driver.outputs.chromedriver-path }}
          WASM_BINDGEN_TEST_TIMEOUT: "120"
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/target/webgpu-webdriver.json

  wasm-webgl2-contract:
    name: WebGL2 fail-closed and resource contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: browser-actions/setup-chrome@v1
        id: chrome-with-driver
        with:
          install-chromedriver: true
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Bind the matching Chrome binary to WebDriver
        run: >-
          python3 -c "import json, pathlib;
          source=pathlib.Path('scripts/webgpu_webdriver.json');
          output=pathlib.Path('target/webgl2-webdriver.json');
          data=json.loads(source.read_text());
          data['goog:chromeOptions']['binary']='${{ steps.chrome-with-driver.outputs.chrome-path }}';
          output.parent.mkdir(parents=True, exist_ok=True);
          output.write_text(json.dumps(data))"
      - name: Run fail-closed and fixed resource-floor tests in Chrome
        run: >-
          cargo test -p fluxel-rhi
          --target wasm32-unknown-unknown
          --no-default-features
          --features webgl2
          --lib
          --locked
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          CHROMEDRIVER: ${{ steps.chrome-with-driver.outputs.chromedriver-path }}
          WASM_BINDGEN_TEST_TIMEOUT: "120"
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ github.workspace }}/target/webgl2-webdriver.json

  cross-repo-browser-smoke:
    name: Exact-revision ${{ matrix.backend }} WASM to JSBridge Chrome smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: webgl2
            entry: demo/index.html
          - backend: webgpu
            entry: demo/webgpu.html
    steps:
      - uses: actions/checkout@v4
        with:
          path: rendering
      - uses: actions/checkout@v4
        with:
          repository: fluxel-project/fluxel-jsbridge
          ref: c010016701f566123040d2735de1c2b9549bdca2
          path: jsbridge
      - name: Verify pinned JSBridge revision
        run: test "$(git -C jsbridge rev-parse HEAD)" = "c010016701f566123040d2735de1c2b9549bdca2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jsbridge/package-lock.json
      - name: Validate pinned JSBridge package
        working-directory: jsbridge
        run: |
          npm ci
          npm test
          npm pack --dry-run
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: cargo build -p fluxel-rendering-wasm --target wasm32-unknown-unknown --release --locked
        working-directory: rendering
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Run exact rendering-WASM to JSBridge Chrome smoke
        run: >-
          python3 rendering/scripts/stage2_evidence.py
          --site-root jsbridge/packages/browser
          --entry ${{ matrix.entry }}
          --backend ${{ matrix.backend }}
          --wasm rendering/target/wasm32-unknown-unknown/release/fluxel_rendering_wasm.wasm
          --bindgen-out jsbridge/packages/browser/demo/wasm
          --output rendering/target/ci-evidence/${{ matrix.backend }}
          --chrome "${{ steps.chrome.outputs.chrome-path }}"
          --headless
          --frames 2
          --timeout 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-revision-${{ matrix.backend }}-browser-smoke
          path: |
            rendering/target/ci-evidence/${{ matrix.backend }}/*.json
            rendering/target/ci-evidence/${{ matrix.backend }}/*.png
            rendering/target/ci-evidence/${{ matrix.backend }}/*.log
          if-no-files-found: warn

  rhi-native-compile-link:
    name: Native compile/link (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: windows-latest
    strategy:
      matrix:
        toolchain: ["1.87.0", stable]
        # The GL-only combination is here rather than in the Linux job because
        # its provider is Windows-only (`glutin_wgl_sys` + WGL).  It is a
        # feature combination and not a backend matrix cell: the crate has no
        # GL `Backend` variant in 0.15, so what this proves is that the
        # GL-family contract layer builds, lints and tests with no DX12 or
        # Vulkan in the graph.
        features: [dx12, vulkan, "dx12,vulkan", native-gl-wgl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test -p fluxel-rhi --no-default-features --features "${{ matrix.features }}" --locked

  rhi-native-lint:
    name: Native RHI lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p fluxel-rhi --all-targets --all-features --locked -- -D warnings
      # `--all-targets` rather than `--lib` on purpose: the test-only helper the
      # first GL-only lint run caught (`execution/compute.rs`, a test accessor
      # gated on `windows` while its callers are gated on the native feature
      # pair) is invisible to a lib-only lint, so the weaker form would have
      # blessed the warning that made this line worth adding.
      - run: cargo clippy -p fluxel-rhi --no-default-features --features native-gl-wgl --all-targets --locked -- -D warnings

  gl4-conformance:
    name: Desktop GL4 conformance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest scripts/tests/test_check_desktop_gl4_conformance.py
      # The retained report is one real context's answer, so this half runs
      # everywhere: a driver is required to *collect* the JSON and none is
      # required to adjudicate it.  Keeping it in CI is what makes the gate a
      # standing check rather than a script someone ran once -- the arithmetic
      # it holds is what fails when the crate's contract drifts away from the
      # hardware answer it was last checked against.
      - run: python scripts/check_desktop_gl4_conformance.py --report scripts/tests/data/desktop_gl4_radeon_780m.json
      # The screening itself needs WGL and a driver, which is why it is not here;
      # its arithmetic is what is checked, against the workload block a real
      # context produced.  A funnel whose statistics quietly changed shape would
      # still print a winner, and this is the line that refuses that.
      - run: python -m unittest scripts/tests/test_check_gl_state_cache_screening.py

  windows-workspace:
    name: Windows workspace native glue
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p fluxel-rhi --no-default-features --locked
      - run: cargo test -p fluxel-rhi --no-default-features --features test-support --locked
