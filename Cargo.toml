[workspace]
resolver = "2"
members = [
    "crates/shader",
    "crates/material",
    "crates/renderer",
]
exclude = [
    "crates/renderer/examples/external-renderer",
    "crates/renderer/examples/rendering-integration",
]

[workspace.package]
version = "0.16.0"

[profile.profiling]
inherits = "release"
debug = true
