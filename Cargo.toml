[workspace]
resolver = "2"
members = ["crates/rendergraph", "crates/renderer", "crates/rhi", "crates/rendering-wasm"]
# `crates/wgpu-hal` is the patched wgpu-hal 30.0.1 source consumed only through
# `fluxel-rhi`'s path dependency. It is excluded so workspace-wide commands
# neither build it with `--all-features` nor reach its upstream-only dev
# surface; being a path dependency inside the repository is what makes the
# patch travel to Git consumers, which a root `[patch.crates-io]` cannot do.
exclude = ["crates/wgpu-hal"]

[workspace.package]
version = "0.15.0"

[profile.profiling]
inherits = "release"
debug = true
